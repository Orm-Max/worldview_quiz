/* Визуальный язык взят у презентации: серый радиальный фон, чёрные плашки с белым и жёлтым,
   светло-серые «ячейки таблицы» для содержимого. */

:root {
  --bg-center: #8e8e8e;
  --bg-edge: #3f3f3f;
  --ink: #111111;
  --ink-soft: #3d3d3d;
  --paper: #e8e8e8;
  --paper-2: #cbcbcb;
  --black: #0d0d0d;
  --white: #ffffff;
  --yellow: #ffe600;
  --line: #9a9a9a;

  --font-head: 'Oswald', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;

  --step--1: 0.875rem;
  --step-0: 1rem;
  --step-1: 1.25rem;
  --step-2: 1.625rem;
  --step-3: clamp(2rem, 6vw, 3.25rem);

  --radius: 6px;
  color-scheme: light;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.6;
  color: var(--ink);
  background: radial-gradient(ellipse at 50% 30%, var(--bg-center), var(--bg-edge) 80%) fixed;
  background-color: var(--bg-edge);
}

.page {
  max-width: 760px;
  margin: 0 auto;
  padding: 24px 16px 64px;
}

.stack > * + * {
  margin-top: 20px;
}
.stack-sm > * + * {
  margin-top: 12px;
}

p,
ul,
ol,
h1,
h2,
h3,
figure {
  margin: 0;
}

h1,
h2,
h3 {
  font-family: var(--font-head);
  font-weight: 600;
  line-height: 1.12;
  letter-spacing: 0.01em;
}
h1 {
  font-size: var(--step-3);
}
h2 {
  font-size: var(--step-2);
}
h3 {
  font-size: var(--step-1);
}

:focus-visible {
  outline: 3px solid var(--yellow);
  outline-offset: 2px;
  box-shadow: 0 0 0 5px var(--black);
}
[tabindex='-1']:focus {
  outline: none;
  box-shadow: none;
}

/* Чёрная плашка, как заголовки слайдов */
.banner {
  background: var(--black);
  color: var(--white);
  padding: 28px 24px;
  border-radius: var(--radius);
}
.banner__sub {
  margin-top: 8px;
  font-family: var(--font-head);
  font-weight: 500;
  font-size: var(--step-1);
  color: var(--yellow);
}
.banner h1 + .banner__sub {
  margin-top: 12px;
}
.banner__sub:first-child {
  margin: 0 0 8px;
}

.panel {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
}
.panel__title {
  font-family: var(--font-head);
  font-weight: 600;
  font-size: var(--step-1);
}

.note {
  font-size: var(--step--1);
  color: var(--white);
  background: rgba(0, 0, 0, 0.55);
  padding: 8px 12px;
  border-radius: var(--radius);
}
.note--hint {
  background: transparent;
  color: #e4e4e4;
  padding: 0 4px;
}
.panel .note {
  color: var(--ink-soft);
  background: transparent;
  padding: 0;
}

/* Метки происхождения */
.chip {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 600;
  line-height: 1.5;
  white-space: nowrap;
}
.chip--deck {
  background: var(--black);
  color: var(--yellow);
}
.chip--extra {
  background: transparent;
  color: var(--ink);
  border: 1.5px dashed var(--ink-soft);
}

.legend {
  display: flex;
  gap: 12px;
  align-items: baseline;
}
.legend .chip {
  flex: none;
  min-width: 118px;
  text-align: center;
}

/* Список типов на старте */
.type-list {
  list-style: none;
  padding: 0;
  display: grid;
  border: 1px solid var(--ink);
  border-radius: var(--radius);
  overflow: hidden;
}
.type-list li {
  display: grid;
  grid-template-columns: 1fr;
  gap: 2px;
  padding: 10px 14px;
  background: var(--paper);
}
.type-list li:nth-child(even) {
  background: var(--paper-2);
}
.type-list strong {
  font-family: var(--font-head);
  font-weight: 600;
  font-size: var(--step-1);
}
.type-list span {
  color: var(--ink-soft);
}
@media (min-width: 560px) {
  .type-list li {
    grid-template-columns: 220px 1fr;
    align-items: baseline;
    gap: 16px;
  }
}

/* Кнопки */
.actions {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.actions--start {
  justify-content: flex-start;
  align-items: center;
  gap: 16px;
}
.actions--start .note {
  flex: 1 1 220px;
}

.btn {
  font-family: var(--font-head);
  font-weight: 600;
  font-size: var(--step-1);
  line-height: 1;
  padding: 14px 26px;
  min-height: 48px;
  border-radius: var(--radius);
  border: 2px solid var(--black);
  cursor: pointer;
  transition: background-color 120ms, color 120ms, border-color 120ms;
}
.btn--primary {
  background: var(--black);
  color: var(--yellow);
}
.btn--primary:hover:not(:disabled) {
  background: var(--yellow);
  color: var(--black);
}
.btn--ghost {
  background: var(--paper);
  color: var(--ink);
}
.btn--ghost:hover {
  background: var(--paper-2);
}
.btn:disabled {
  background: var(--paper-2);
  color: #6b6b6b;
  border-color: #7a7a7a;
  cursor: not-allowed;
}

/* Квиз */
.progress {
  height: 8px;
  background: rgba(0, 0, 0, 0.45);
  border-radius: 999px;
  overflow: hidden;
}
.progress__bar {
  height: 100%;
  background: var(--yellow);
  transition: width 200ms ease-out;
}

.question-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.question-meta__count {
  font-family: var(--font-head);
  font-weight: 500;
  font-size: var(--step-1);
  color: var(--white);
  background: var(--black);
  padding: 4px 14px;
  border-radius: var(--radius);
}
.question-meta .chip--extra {
  background: var(--paper);
}

.question {
  margin: 0;
  padding: 0;
  border: 0;
  min-inline-size: 0;
}
.question__legend {
  display: block;
  width: 100%;
  padding: 0;
  margin-bottom: 14px;
  background: var(--black);
  color: var(--white);
  border-radius: var(--radius);
  padding: 18px 20px;
}
.question__topic {
  display: block;
  margin-bottom: 6px;
  font-size: var(--step--1);
  color: var(--yellow);
}
.question__text {
  display: block;
  font-family: var(--font-head);
  font-weight: 500;
  font-size: var(--step-2);
  line-height: 1.25;
}

.options {
  display: grid;
  gap: 10px;
}
.option {
  position: relative;
  display: flex;
  gap: 14px;
  align-items: flex-start;
  padding: 14px 16px;
  background: var(--paper);
  border: 2px solid var(--line);
  border-radius: var(--radius);
  cursor: pointer;
  transition: border-color 120ms, background-color 120ms;
}
.option:hover {
  border-color: var(--black);
  background: #f2f2f2;
}
.option input {
  position: absolute;
  opacity: 0;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  cursor: pointer;
}
.option:has(input:focus-visible) {
  outline: 3px solid var(--yellow);
  outline-offset: 2px;
  box-shadow: 0 0 0 5px var(--black);
}
.option__key {
  flex: none;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  margin-top: 1px;
  border: 2px solid var(--ink);
  border-radius: 4px;
  font-family: var(--font-head);
  font-weight: 600;
  font-size: 0.95rem;
}
.option__text {
  flex: 1;
}
.option--checked {
  background: var(--black);
  border-color: var(--black);
  color: var(--white);
}
.option--checked:hover {
  background: var(--black);
}
.option--checked .option__key {
  background: var(--yellow);
  border-color: var(--yellow);
  color: var(--black);
}

/* Результат */
.consistency {
  padding-top: 12px;
  border-top: 1px solid var(--line);
  color: var(--ink-soft);
}

.result-chart {
  display: block;
  width: 100%;
  max-width: 440px;
  height: auto;
  margin-inline: auto;
}

.result-chart__grid {
  fill: none;
  stroke: #939393;
}

.result-chart__shape {
  fill: var(--yellow);
  fill-opacity: 0.65;
  stroke: var(--ink);
  stroke-width: 2;
}

.result-chart__dot,
.result-chart__label {
  fill: var(--ink);
}

.result-chart__label {
  font-size: 15px;
  font-weight: 600;
}

.result-chart__percent {
  font-size: 19px;
  font-weight: 700;
}

.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.tab {
  font-family: var(--font-head);
  font-weight: 500;
  font-size: var(--step-0);
  padding: 8px 14px;
  min-height: 40px;
  border-radius: var(--radius);
  border: 2px solid var(--black);
  background: var(--paper);
  color: var(--ink);
  cursor: pointer;
}
.tab:hover {
  background: var(--paper-2);
}
.tab--active,
.tab--active:hover {
  background: var(--black);
  color: var(--yellow);
}

.detail {
  padding-top: 8px;
}
.detail__block {
  padding: 14px 16px;
  background: var(--white);
  border-left: 6px solid var(--paper-2);
  border-radius: 0 var(--radius) var(--radius) 0;
}
.detail__block--deck {
  border-left-color: var(--black);
}
.detail__label {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
  font-size: var(--step--1);
  color: var(--ink-soft);
}
.detail__block ul {
  padding-left: 1.1rem;
  display: grid;
  gap: 8px;
}

.source-tag {
  display: inline-block;
  margin-left: 4px;
  padding: 0 8px;
  border: 1px solid var(--ink-soft);
  border-radius: 999px;
  font-size: 0.78rem;
  color: var(--ink-soft);
  vertical-align: baseline;
}
.source-tag--link {
  color: var(--ink);
  text-decoration: underline;
  text-underline-offset: 2px;
}
.source-tag--link:hover {
  background: var(--yellow);
}

/* Карта */
.map-figure {
  display: grid;
  gap: 10px;
}
.map-figure figcaption {
  font-size: var(--step--1);
  color: var(--ink-soft);
}
.map {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  border: 2px solid var(--black);
  border-radius: var(--radius);
  background:
    linear-gradient(var(--black), var(--black)) center / 2px 100% no-repeat,
    linear-gradient(var(--black), var(--black)) center / 100% 2px no-repeat,
    linear-gradient(to bottom, #e8e8e8 50%, #cbcbcb 50%);
  overflow: hidden;
}
@media (min-width: 640px) {
  .map {
    aspect-ratio: 16 / 10;
  }
}
.map__corner {
  position: absolute;
  max-width: 44%;
  font-size: 0.72rem;
  line-height: 1.25;
  color: #4a4a4a;
}
.map__corner--tl {
  top: 8px;
  left: 10px;
}
.map__corner--tr {
  top: 8px;
  right: 10px;
  text-align: right;
}
.map__corner--bl {
  bottom: 8px;
  left: 10px;
}
.map__corner--br {
  bottom: 8px;
  right: 10px;
  text-align: right;
}

.map__anchor {
  position: absolute;
  display: flex;
  align-items: center;
  gap: 6px;
  transform: translate(-6px, -50%);
  font-size: 0.78rem;
  color: #3a3a3a;
  white-space: nowrap;
}
.map__anchor i {
  flex: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 2px solid #4a4a4a;
  background: transparent;
}
.map__anchor--left {
  flex-direction: row-reverse;
  transform: translate(calc(-100% + 6px), -50%);
}

.map__you {
  position: absolute;
  z-index: 2;
  width: 24px;
  height: 24px;
  margin: -12px 0 0 -12px;
  border-radius: 50%;
  background: var(--yellow);
  border: 3px solid var(--black);
  box-shadow: 0 0 0 4px rgba(255, 230, 0, 0.45);
}
.map__you span {
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translate(-50%, -4px);
  padding: 0 8px;
  background: var(--black);
  color: var(--yellow);
  font-family: var(--font-head);
  font-weight: 600;
  border-radius: 4px;
}

/* Разбор ответов и источники */
.review > summary {
  cursor: pointer;
  font-family: var(--font-head);
  font-weight: 600;
  font-size: var(--step-2);
}
.review[open] > summary {
  margin-bottom: 14px;
}
.review__list {
  padding-left: 1.2rem;
  display: grid;
  gap: 16px;
}
.review__q {
  font-weight: 600;
}
.review__a {
  margin-top: 4px;
  color: var(--ink-soft);
}
.review__type {
  display: inline-block;
  margin-right: 8px;
  padding: 0 8px;
  background: var(--black);
  color: var(--yellow);
  border-radius: 4px;
  font-size: 0.78rem;
  font-weight: 600;
}
.review .note {
  margin-top: 16px;
}

.sources {
  list-style: none;
  padding: 0;
  display: grid;
  gap: 10px;
}
.sources a {
  color: var(--ink);
  text-underline-offset: 2px;
}
.sources a:hover {
  background: var(--yellow);
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    transition: none !important;
    animation: none !important;
  }
}

/** Перемешивает копию массива (Фишер — Йейтс). rng можно подменить в тестах. */
function shuffle(items, rng = Math.random) {
  const copy = [...items]
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1))
    ;[copy[i], copy[j]] = [copy[j], copy[i]]
  }
  return copy
}

/** Порядок вопросов сохраняется, порядок вариантов внутри вопроса меняется. */
function prepareQuiz(questions, rng = Math.random) {
  return questions.map((q) => ({ ...q, options: shuffle(q.options, rng) }))
}


/**
 * answers: { [questionId]: typeId }
 * Returns scores, rankings, leading approaches, map position, and consistency level.
 */
function computeResult(answers) {
  const scores = Object.fromEntries(TYPE_ORDER.map((id) => [id, 0]))
  for (const typeId of Object.values(answers)) {
    if (typeId in scores) scores[typeId] += 1
  }
  const total = Object.values(scores).reduce((a, b) => a + b, 0)

  // Sort by descending score, preserving TYPE_ORDER for ties.
  const ranking = TYPE_ORDER.map((id, order) => ({
    id,
    score: scores[id],
    share: total ? scores[id] / total : 0,
    order,
  }))
    .sort((a, b) => b.score - a.score || a.order - b.order)
    .map(({ order, ...rest }) => rest)

  const best = ranking[0]?.score ?? 0
  const topIds = best > 0 ? ranking.filter((r) => r.score === best).map((r) => r.id) : []

  let x = 0.5
  let y = 0.5
  if (total) {
    x = TYPE_ORDER.reduce((sum, id) => sum + scores[id] * TYPES[id].position.x, 0) / total
    y = TYPE_ORDER.reduce((sum, id) => sum + scores[id] * TYPES[id].position.y, 0) / total
  }

  const topShare = total ? best / total : 0
  const consistency = topShare >= 0.6 ? 'high' : topShare >= 0.4 ? 'mixed' : 'scattered'

  return { scores, total, ranking, topIds, position: { x, y }, topShare, consistency }
}

function headline(topIds) {
  if (topIds.length === 0) return 'No answers'
  if (topIds.length === 1) return TYPES[topIds[0]].name
  if (topIds.length === 2) return `${TYPES[topIds[0]].name} and ${TYPES[topIds[1]].name}`
  return 'Mixed profile'
}

/** Describes the map position for the caption and screen readers. */
function describePosition({ x, y }) {
  const horizontal = x > 0.6 ? 'closer to the secular end' : x < 0.4 ? 'closer to the theistic end' : 'between theistic and secular'
  const vertical = y > 0.6 ? 'closer to the individual end' : y < 0.4 ? 'closer to the collective end' : 'between individual and collective'
  return `${horizontal} and ${vertical}`
}

const CONSISTENCY_TEXT = {
  high: 'Your answers consistently favored one approach across most questions.',
  mixed: 'Your answers favored two approaches about equally.',
  scattered:
    'Your answers span several approaches. Looking back at your choices can help you see why different approaches felt right in different situations.',
}


const center = { x: 180, y: 145 }
const radius = 100

function point(index, fraction = 1) {
  const angle = index * 2 * Math.PI / TYPE_ORDER.length - Math.PI / 2
  return {
    x: center.x + radius * fraction * Math.cos(angle),
    y: center.y + radius * fraction * Math.sin(angle),
  }
}

function polygon(points) {
  return points.map(({ x, y }) => `${x},${y}`).join(' ')
}

function resultChart({ scores, total }) {
  const axes = TYPE_ORDER.map((id, index) => {
    const share = total ? scores[id] / total : 0
    return {
      id,
      end: point(index),
      value: point(index, share),
      label: point(index, 1.27),
      percent: `${Math.round(share * 100)}%`,
    }
  })

  const description = axes.map(({ id, percent }) => `${TYPES[id].name}: ${percent}`).join(', ')

  return `
    <svg class="result-chart" viewBox="0 0 360 290" role="img" aria-label="Ethical approaches by share of answers. ${description}.">
      ${[0.25, 0.5, 0.75, 1].map((fraction) => `
        <polygon class="result-chart__grid" points="${polygon(axes.map((_, index) => point(index, fraction)))}" />
      `).join('')}
      ${axes.map(({ end }) => `
        <line class="result-chart__grid" x1="${center.x}" y1="${center.y}" x2="${end.x}" y2="${end.y}" />
      `).join('')}
      <polygon class="result-chart__shape" points="${polygon(axes.map(({ value }) => value))}" />
      ${axes.map(({ id, value, label, percent }) => `
        <circle class="result-chart__dot" cx="${value.x}" cy="${value.y}" r="3" />
        <text class="result-chart__label" x="${label.x}" y="${label.y}" text-anchor="middle">
          ${TYPES[id].short}
          <tspan class="result-chart__percent" x="${label.x}" dy="22">${percent}</tspan>
        </text>
      `).join('')}
    </svg>`
}


const page = document.querySelector('main')
let quiz = []
let answers = {}
let index = 0

function show(markup, focusId) {
  page.innerHTML = markup
  window.scrollTo(0, 0)
  document.getElementById(focusId)?.focus({ preventScroll: true })
}

function showIntro() {
  show(`<section class="stack" aria-labelledby="intro-title">
      <header class="banner">
        <h1 id="intro-title" tabindex="-1">What Is Right and Wrong?</h1>
        <p class="banner__sub">An ethics quiz from the course on worldviews</p>
      </header>

      <div class="panel stack-sm">
        <p>
          Find out which of five ethical approaches best matches your views.
        </p>
        <ul class="type-list" aria-label="Five ethical approaches">
          ${TYPE_ORDER.map((id) => `<li><strong>${TYPES[id].name}</strong><span>${TYPES[id].tagline}</span></li>`).join('')}
        </ul>
      </div>

      <div class="actions actions--start">
        <button type="button" class="btn btn--primary" id="start">
          Start quiz
        </button>
        <p class="note">${QUESTIONS.length} questions, about three minutes. Pick the answer that feels closest to your first reaction. Your answers are never saved.</p>
      </div>
      <p class="note">
        This quiz is for learning and reflection. Philosophers often draw on several approaches at once.
      </p>
    </section>`, 'intro-title')
  document.getElementById('start').addEventListener('click', startQuiz)
}

function startQuiz() {
  quiz = prepareQuiz(QUESTIONS)
  answers = {}
  index = 0
  showQuestion()
}

function showQuestion() {
  const question = quiz[index]
  const step = index + 1
  const total = quiz.length
  show(`
    <section class="stack" aria-labelledby="question-title">
      <div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="1" aria-valuemax="${total}" aria-valuenow="${step}">
        <div class="progress__bar" style="width:${step / total * 100}%"></div>
      </div>
      <div class="question-meta"><span class="question-meta__count">Question ${step} of ${total}</span></div>
      <fieldset class="question">
        <legend class="question__legend">
          <span class="question__topic">${question.topic}</span>
          <span id="question-title" tabindex="-1" class="question__text">${question.text}</span>
        </legend>
        <div class="options">
          ${question.options.map((option, i) => `
            <label class="option">
              <input type="radio" name="${question.id}" value="${option.type}">
              <span class="option__key" aria-hidden="true">${i + 1}</span>
              <span class="option__text">${option.text}</span>
            </label>
          `).join('')}
        </div>
      </fieldset>
      <div class="actions">
        <button id="back" type="button" class="btn btn--ghost">${index ? 'Back' : 'Back to introduction'}</button>
        <button id="next" type="button" class="btn btn--primary">${step === total ? 'See results' : 'Next'}</button>
      </div>
      <p class="note note--hint">Press 1–5 to choose an answer and Enter to continue.</p>
    </section>`, 'question-title')

  const radios = [...page.querySelectorAll('input[type="radio"]')]
  const next = document.getElementById('next')

  function select(type) {
    for (const radio of radios) {
      radio.checked = radio.value === type
      radio.closest('label').classList.toggle('option--checked', radio.checked)
    }
    next.disabled = !type
  }

  select(answers[question.id])
  for (const radio of radios) {
    radio.addEventListener('change', () => {
      answers[question.id] = radio.value
      select(radio.value)
    })
  }
  document.getElementById('back').addEventListener('click', () => {
    if (index === 0) return showIntro()
    index -= 1
    showQuestion()
  })
  next.addEventListener('click', () => {
    if (step === total) return showResult()
    index += 1
    showQuestion()
  })
}

window.addEventListener('keydown', (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey || event.repeat) return
  const next = document.getElementById('next')
  if (!next) return
  if (/^[1-5]$/.test(event.key)) {
    page.querySelectorAll('input[type="radio"]')[Number(event.key) - 1]?.click()
  } else if (event.key === 'Enter' && !event.target.closest?.('button, a')) {
    next.click()
  }
})

function positionMap(position) {
  const caption = `Your position is ${describePosition(position)}.`
  const place = ({ x, y }) => `left:${x * 100}%;top:${(1 - y) * 100}%`
  return `
    <figure class="map-figure">
      <div class="map" role="img" aria-label="${caption}">
        <span class="map__corner map__corner--tl">Theistic, individual</span>
        <span class="map__corner map__corner--tr">Secular, individual</span>
        <span class="map__corner map__corner--bl">Theistic, collective</span>
        <span class="map__corner map__corner--br">Secular, collective</span>
        ${TYPE_ORDER.map((id) => `
          <span class="map__anchor map__anchor--${TYPES[id].labelSide}" style="${place(TYPES[id].position)}" aria-hidden="true">
            <i></i><b>${TYPES[id].short}</b>
          </span>
        `).join('')}
        <span class="map__you" style="${place(position)}" aria-hidden="true"><span>You</span></span>
      </div>
      <figcaption><strong>${caption}</strong> The map shows approximate positions for the five approaches.</figcaption>
    </figure>`
}

function sourceTag(sourceId) {
  const source = SOURCES[sourceId]
  return source
    ? `<a class="source-tag source-tag--link" href="${source.url}" target="_blank" rel="noreferrer">${source.title}</a>`
    : '<span class="source-tag">General background</span>'
}

function showResult() {
  const result = computeResult(answers)
  const title = headline(result.topIds)
  const lead = result.topIds.length === 1 ? TYPES[result.topIds[0]] : null
  show(`
    <section class="stack" aria-labelledby="result-title">
      <header class="banner">
        <p class="banner__sub">Your result</p>
        <h1 id="result-title" tabindex="-1">${title}</h1>
        ${lead ? `<p class="banner__sub">${lead.tagline}</p>` : ''}
      </header>
      <div class="panel stack-sm">
        <p>${lead?.summary ?? 'Several approaches tied for first place. Use the tabs below to learn about each approach.'}</p>
        <p class="consistency">${CONSISTENCY_TEXT[result.consistency]}</p>
      </div>
      <div class="panel">${resultChart(result)}</div>
      <div class="panel stack-sm">
        <h2>Explore the approaches</h2>
        <div class="tabs" role="group" aria-label="Choose an ethical approach">
          ${result.ranking.map(({ id }) => `
            <button type="button" class="tab" data-type="${id}">${TYPES[id].short}</button>
          `).join('')}
        </div>
        <article class="detail stack-sm" aria-live="polite"></article>
      </div>
      <div class="panel stack-sm">
        <h2>Where you fall on the worldview map</h2>
        ${positionMap(result.position)}
      </div>
      <details class="panel review">
        <summary>Review your answers</summary>
        <ol class="review__list">
          ${quiz.map((question) => {
            const chosen = question.options.find(({ type }) => type === answers[question.id])
            return `<li>
              <p class="review__q">${question.text}</p>
              <p class="review__a"><span class="review__type">${TYPES[chosen.type].short}</span> ${chosen.text}</p>
            </li>`
          }).join('')}
        </ol>
        <p class="note">
          Think about your answers. Which reflect convictions, and which reflect opinions?
          Convictions withstand skepticism and sit closer to the center of the target. Opinions are easier to change.
        </p>
      </details>
      <div class="actions">
        <button id="copy" type="button" class="btn btn--ghost">Copy result</button>
        <button id="retake" type="button" class="btn btn--primary">Retake quiz</button>
      </div>
      <p class="note" role="status"></p>
    </section>`, 'result-title')

  const tabs = [...page.querySelectorAll('.tab')]
  const detail = page.querySelector('.detail')
  function selectApproach(id) {
    const approach = TYPES[id]
    for (const tab of tabs) {
      const active = tab.dataset.type === id
      tab.classList.toggle('tab--active', active)
      tab.setAttribute('aria-pressed', active)
    }
    detail.innerHTML = `
      <h3>${approach.name}</h3>
      <p>${approach.summary}</p>
      <section class="detail__block detail__block--deck">
        <p class="detail__label"><strong>How it relates to worldviews</strong></p>
        <ul>${approach.deck.map((text) => `<li>${text}</li>`).join('')}</ul>
      </section>
      <section class="detail__block">
        <p class="detail__label">Additional context and explanations</p>
        <ul>${approach.extra.map((item) => `<li>${item.text} ${sourceTag(item.sourceId)}</li>`).join('')}</ul>
      </section>
      <section class="detail__block">
        <p class="detail__label"><strong>Main challenge</strong></p>
        <p>${approach.challenge}</p>
      </section>`
  }

  for (const tab of tabs) tab.addEventListener('click', () => selectApproach(tab.dataset.type))
  selectApproach(result.topIds[0])
  document.getElementById('retake').addEventListener('click', startQuiz)
  document.getElementById('copy').addEventListener('click', async () => {
    const status = page.querySelector('[role="status"]')
    const lines = result.ranking.map(({ id, score }) => `${TYPES[id].name}: ${score} of ${result.total}`)
    const text = `What Is Right and Wrong? — Ethics Quiz\nMy result: ${title}\n${lines.join('\n')}`
    try {
      await navigator.clipboard.writeText(text)
      status.textContent = 'Result copied'
    } catch {
      status.textContent = 'Could not copy automatically. Select and copy the result text manually.'
    }
  })
}

showIntro()
    </script>
  </body>
</html>
